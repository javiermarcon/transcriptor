[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meetings-transcriber"
version = "0.2.0"
description = "Grabación, transcripción y diarización local de reuniones con perfiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
meetings-transcriber = "meetings_transcriber.cli:main"
meetings-transcriptor-native-host = "meetings_transcriber.native_host:main"
meetings-transcriptor-native-messaging = "meetings_transcriber.native_messaging_install:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "DTZ", "RUF"]
