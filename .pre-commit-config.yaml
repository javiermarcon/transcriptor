repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
